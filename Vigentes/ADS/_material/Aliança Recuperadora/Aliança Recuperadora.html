function SimulationForm() {
  const [form, setForm] = useState({nome:'',email:'',whatsapp:'',estado:'',banco:'',veiculo:'',parcelas:'',valor:'',urgencia:'Contato imediato'});

  const estados = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
  const bancos = ['Banco do Brasil','Bradesco','Caixa Econômica','Itaú','Santander','Nubank','C6 Bank','BV Financeira','Banco Pan','Outros'];

  const handleSubmit = (e) => {
    e.preventDefault();
    const message = `Olá, gostaria de fazer uma simulação de redução do meu financiamento.\n\nDados informados:\nNome: ${form.nome}\nE-mail: ${form.email}\nWhatsApp: ${form.whatsapp}\nEstado: ${form.estado}\nBanco: ${form.banco}\nTipo de veículo: ${form.veiculo}\nQuantidade de parcelas: ${form.parcelas}\nValor da parcela: ${form.valor}\nNível de urgência: ${form.urgencia}`;
    const whatsappUrl = `https://wa.me/08005552569?text=${encodeURIComponent(message)}`;
    window.location.href = whatsappUrl;
  };

  return (
    <section className="form-section" id="simulador">
      <div className="form-container">
        <div className="section-label">Simulador Gratuito</div>
        <h2 className="section-title">Simule a redução do seu financiamento</h2>
        <p className="section-sub">Preencha o formulário e receba em até 24h uma análise completa do seu contrato.</p>
        <div className="form-card">
          <form onSubmit={handleSubmit}>
            <div className="form-grid">
              <div className="form-group full">
                <label className="form-label">Nome completo <span>*</span></label>
                <input className="form-input" placeholder="Seu nome" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} required />
              </div>
              <div className="form-group">
                <label className="form-label">E-mail <span>*</span></label>
                <input className="form-input" type="email" placeholder="seu@email.com" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} required />
              </div>
              <div className="form-group">
                <label className="form-label">WhatsApp <span>*</span></label>
                <input className="form-input" placeholder="(00) 00000-0000" value={form.whatsapp} onChange={e=>setForm({...form,whatsapp:e.target.value})} required />
              </div>
              <div className="form-group">
                <label className="form-label">Estado <span>*</span></label>
                <div className="select-wrap">
                  <select className="form-select" value={form.estado} onChange={e=>setForm({...form,estado:e.target.value})} required>
                    <option value="">Selecione seu Estado</option>
                    {estados.map(e=><option key={e}>{e}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Banco <span>*</span></label>
                <div className="select-wrap">
                  <select className="form-select" value={form.banco} onChange={e=>setForm({...form,banco:e.target.value})} required>
                    <option value="">Selecione o banco</option>
                    {bancos.map(b=><option key={b}>{b}</option>)}
                  </select>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Tipo de veículo <span>*</span></label>
                <div className="select-wrap">
                  <select className="form-select" value={form.veiculo} onChange={e=>setForm({...form,veiculo:e.target.value})} required>
                    <option value="">Selecione</option>
                    <option>Carro</option><option>Moto</option><option>Caminhonete</option><option>Caminhão</option>
                  </select>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Qtd. de parcelas <span>*</span></label>
                <input className="form-input" type="number" placeholder="Ex: 48" value={form.parcelas} onChange={e=>setForm({...form,parcelas:e.target.value})} required />
              </div>
              <div className="form-group">
                <label className="form-label">Valor da parcela <span>*</span></label>
                <input className="form-input" placeholder="R$ 0,00" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})} required />
              </div>
              <div className="form-group full">
                <label className="form-label">Nível de urgência <span>*</span></label>
                <div className="select-wrap">
                  <select className="form-select" value={form.urgencia} onChange={e=>setForm({...form,urgencia:e.target.value})}>
                    <option>Contato imediato</option>
                    <option>Em até 48h</option>
                    <option>Esta semana</option>
                    <option>Apenas consulta</option>
                  </select>
                </div>
              </div>

            <p className="form-privacy">🔒 Seus dados estão protegidos. Não compartilhamos com terceiros.</p>
          </form>
        </div>
      </div>
    </section>
  );
}

function TweaksPanel({ visible, tweaks, setTweaks }) {
  return (
    <div className={`tweaks-panel ${visible ? 'visible' : ''}`}>

      <div className="tweak-row">

        <div className="tweak-options">
          {[['#00C4B4','Teal'],['#4F6AF0','Índigo'],['#E05A2B','Laranja']].map(([c,l]) => (
            <div key={c} className={`tweak-color ${tweaks.accentColor===c?'active':''}`}
              style={{background:c}} title={l}
              onClick={() => setTweaks({...tweaks, accentColor:c})} />
          ))}
        </div>
      </div>
      <div className="tweak-row">
        <div className="tweak-label">Estilo do formulário</div>
        <div className="tweak-options">
          {['Branco','Gradiente'].map(s => (
            <button key={s} className={`tweak-opt ${(s==='Branco')===(tweaks.formBg==='white')?'active':''}`}
              onClick={() => setTweaks({...tweaks, formBg: s==='Branco'?'white':'gradient'})}>
              {s}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    // Apply accent color
    document.documentElement.style.setProperty('--teal', tweaks.accentColor);
    document.documentElement.style.setProperty('--teal-light', tweaks.accentColor + 'dd');
    document.documentElement.style.setProperty('--teal-pale', tweaks.accentColor + '18');
  }, [tweaks.accentColor]);

  useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
  }, []);

  const handleTweaks = (t) => {
    setTweaks(t);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits: t}, '*');
  };

  const scrollToForm = () => {
    const el = document.getElementById('simulador');
    if (el) el.scrollTop; // can't use scrollIntoView
    window.scrollTo({top: el?.offsetTop - 80, behavior:'smooth'});
  };

  return (
    <>
      <Topbar />
      <Navbar onSimulate={scrollToForm} />
      <Hero onSimulate={scrollToForm} />
      <SimulationForm />
      <About />
      <Services />
      <CtaBanner onSimulate={scrollToForm} />
      <Process />
      <Testimonials />
      <FAQ />
      <Footer />
      <WhatsAppFloat />
      <TweaksPanel visible={tweaksVisible} tweaks={tweaks} setTweaks={handleTweaks} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
